[package]
name = "remoteapp-sync-pg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
postgres = [
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:sha2",
    "dep:tokio-postgres",
    "dep:tokio-postgres-rustls",
    "dep:tokio",
    "dep:webpki-roots",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

crypto-store = { package = "remoteapp-crypto-store", path = "../crypto-store" }

rustls = { version = "0.23.43", features = ["ring"], optional = true }
rustls-pemfile = { version = "2.2.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
tokio = { workspace = true, optional = true }
tokio-postgres = { version = "0.7.15", features = ["with-uuid-1"], optional = true }
tokio-postgres-rustls = { version = "0.14.0", features = ["ring"], optional = true }
webpki-roots = { version = "1.0.2", optional = true }
