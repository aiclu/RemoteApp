[package]
name = "remoteapp-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "remoteapp-preview"
path = "src/main.rs"

[dependencies]
remoteapp-rdp-core = { path = "../../crates/rdp-core" }
slint = { workspace = true, features = ["backend-android-activity-06", "renderer-software"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
remoteapp-crypto-store = { path = "../../crates/crypto-store" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[build-dependencies]
slint-build.workspace = true

[package.metadata.android]
package_name = "com.remoteapp.client"
label = "RemoteAPP"
min_sdk_version = 26

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
